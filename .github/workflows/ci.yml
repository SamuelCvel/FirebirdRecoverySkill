name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PyYAML (validacao do frontmatter)
        shell: pwsh
        run: python -m pip install --quiet pyyaml

      - name: Consistencia do repositorio (JSON, nomes, versao, sintaxe, referencias)
        shell: pwsh
        run: ./tools/Test-Repository.ps1

      - name: Termos sensiveis (padroes genericos; a lista local nao existe no CI)
        shell: pwsh
        run: ./tools/Test-SensitiveTerms.ps1

      - name: PSScriptAnalyzer (severidade Error)
        shell: pwsh
        run: |
          if(-not (Get-Module -ListAvailable PSScriptAnalyzer)){ Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $r = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 240
          if($r.Count -gt 0){ exit 1 }

      - name: Testes unitarios (PowerShell 7)
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: Testes unitarios (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Pacote .skill
        shell: pwsh
        run: ./tools/Build-SkillPackage.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: firebird-recovery.skill
          path: dist/firebird-recovery.skill

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verificar
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Gerar pacote
        shell: pwsh
        run: |
          python -m pip install --quiet pyyaml
          ./tools/Build-SkillPackage.ps1

      - name: Notas da versao (secao do CHANGELOG)
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $c = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($c, "(?ms)^## \[$([regex]::Escape($v))\].*?(?=^## \[|\z)")
          $notas = if($m.Success){ $m.Value } else { "Veja o CHANGELOG.md." }
          Set-Content -Path release-notes.md -Value $notas -Encoding utf8

      - name: Publicar Release com o .skill
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag dist/firebird-recovery.skill --clobber
          } else {
            gh release create $tag dist/firebird-recovery.skill --title "firebird-recovery $tag" --notes-file release-notes.md
          }
